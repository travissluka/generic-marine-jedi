# notes on filenames:
# - data_static and data_generated are test inputs
# - data_output is test output

geometry:
  grid:
    name: S360x180
    domain:
      type: global
      west: -180
  landmask:
    filename: data_static/landmask_1p0.nc

background error:
  covariance model: SABER
  saber central block:
    # The correlation operator
    saber block name: diffusion
    read:
      groups:
      - variables: [seaSurfaceTemperature]
        horizontal:
          filepath: data_generated/parameters_diffusion/diffusion.nc

dirac:
  date: 2010-01-01T12:00:00Z
  variables:
  - name: seaSurfaceTemperature
    ixdir: [20, 50, 100, 100, 150, 200, 250, 300, 350]
    iydir: [10, 25, 85, 50,  75,  100, 125, 150, 175]

background:
  date: 2010-01-01T12:00:00Z
  filename: data_static/sst_1p0.nc
  state variables: [seaSurfaceTemperature]

output dirac:
  filename: data_output/dirac_diffusion.inc.nc

test:
  reference filename: testref/dirac_diffusion.ref
  test output filename: testoutput/dirac_diffusion.ref