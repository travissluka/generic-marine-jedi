# notes on filenames:
# - data_static and data_generated are test inputs
# - data_output is test output

state geometry: &geometry
  grid:
    name: S360x180
    domain:
      type: global
      west: -180
  landmask:
    filename: data_static/landmask_1p0.nc

increment geometry: *geometry

state:
  date: &date 2018-04-15T12:00:00Z
  filename: data_static/sst_1p0.nc
  state variables: [seaSurfaceTemperature]

increment:
  date: *date
  filename: data_generated/3dvar/3dvar.inc.20180415T120000Z.nc
  added variables: [seaSurfaceTemperature]

output:
  prefix: data_output/addincrement.an

test:
  reference filename: testref/addincrement.ref
  test output filename: testoutput/addincrement.ref